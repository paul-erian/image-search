[project]
name = "image-search"
version = "1.0.0"
description = "Image-search is an image search engine based on CLIP model."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.135.2",
    "pillow>=12.1.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.3.0",
    "typer>=0.24.1",
    "uvicorn>=0.42.0",
]

[tool.ruff]
src = ["src"]
select = ["E", "F", "I"]
ignore = ["E203"]
line-length = 100

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.8",
]

[project.scripts]
image-search = "image_search.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"